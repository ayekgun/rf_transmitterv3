sut: drpulltelkomsel
version_validated: "2.0.0"
access: local
log_dir: /home/gunawan/Jamob/2026/PB172645142601YA/drpulltelkomsel/bin
exclude_files:
  - "*.jar"
  - "*.conf"
  - "*.sh"
  - "*.pid"
  - "*.xml"
  - "*.properties"
files:
